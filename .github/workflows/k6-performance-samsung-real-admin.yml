# K6 성능 테스트 - samsung/real/admin 스크립트 주기 실행
# PC 잠자기와 관계없이 GitHub 서버에서 실행됩니다.
#
# [필수] 저장소 Settings → Secrets and variables → Actions 에서 다음 추가:
#   ADMIN_BASE_URL           - admin 대상 URL (예: https://dev-admin.privacydocs.kr/)
#   ADMIN_LOGIN_EMAIL        - admin 로그인 이메일
#   ADMIN_LOGIN_PASSWORD     - admin 로그인 비밀번호
#   K6_INFLUXDB_ADDR         - InfluxDB 주소 (예: https://us-east-1-1.aws.cloud2.influxdata.com)
#   K6_INFLUXDB_ORGANIZATION
#   K6_INFLUXDB_BUCKET
#   K6_INFLUXDB_TOKEN
# [선택] K6_BROWSER_HEADLESS(true), K6_INFLUXDB_PUSH_INTERVAL, SLACK_WEBHOOK_URL
#
name: K6 Performance (samsung/real/admin)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  k6-samsung-real-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (sam-k6)
        uses: actions/checkout@v4
        with:
          ref: sam-k6

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libgbm1 libasound2t64 libxshmfence1 libxrandr2 \
            libpangocairo-1.0-0 libgtk-3-0 \
            chromium-browser || true

      - name: Increase /dev/shm size
        run: sudo mount -t tmpfs -o size=2g tmpfs /dev/shm

      - name: Prepare Result directories
        run: |
          find test-scripts/performance/samsung/real/admin -type d | while read -r dir; do
            mkdir -p "$dir/Result"
          done

      - name: Build k6 with xk6-influxdb
        run: |
          mkdir -p /tmp/k6-build
          chmod 777 /tmp/k6-build

          docker run --rm \
            -v "/tmp/k6-build:/output" \
            grafana/xk6 build \
            --with github.com/grafana/xk6-output-influxdb@latest \
            --output /output/k6

          cp /tmp/k6-build/k6 ./k6
          chmod +x ./k6
          ./k6 version

      - name: Run all K6 scripts (samsung/real/admin)
        env:
          K6_BROWSER_HEADLESS: ${{ secrets.K6_BROWSER_HEADLESS || 'true' }}
          K6_BROWSER_ARGS: >-
            --no-sandbox
            --disable-dev-shm-usage
            --disable-gpu
            --disable-features=CpuFreqScaling,VizDisplayCompositor
            --disable-setuid-sandbox
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          LOGIN_EMAIL: ${{ secrets.ADMIN_LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
          K6_INFLUXDB_ADDR: ${{ secrets.K6_INFLUXDB_ADDR }}
          K6_INFLUXDB_ORGANIZATION: ${{ secrets.K6_INFLUXDB_ORGANIZATION }}
          K6_INFLUXDB_BUCKET: ${{ secrets.K6_INFLUXDB_BUCKET }}
          K6_INFLUXDB_TOKEN: ${{ secrets.K6_INFLUXDB_TOKEN }}
          K6_INFLUXDB_PUSH_INTERVAL: ${{ secrets.K6_INFLUXDB_PUSH_INTERVAL || '60s' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          BASE_DIR="test-scripts/performance/samsung/real/admin"
          echo "=============================================="
          echo "[k6] Running all samsung/real/admin scripts"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "=============================================="

          find "$BASE_DIR" -type f -name "*.js" \
            ! -name "login_helper.js" \
            ! -name "selector_sam.js" \
            ! -name "url_base_sam.js" \
            | sort | while read -r script; do
            echo "----------------------------------------------"
            echo "Running k6 script: $script"
            echo "Start: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "----------------------------------------------"
            mkdir -p "$(dirname "$script")/Result"
            ./k6 run --out xk6-influxdb=$K6_INFLUXDB_ADDR "$script"
            echo "Finished: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
          done

          echo "=============================================="
          echo "[k6] All samsung/real/admin scripts finished"
          echo "End: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "=============================================="
